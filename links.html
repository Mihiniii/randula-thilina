<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Guest Links · Randula & Thilina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Pinyon+Script&family=Montserrat:wght@300;400;500&display=swap">
<style>
/* Layout: a single working column — paste names, get one personal link per guest with copy and WhatsApp buttons */
:root{
  --paper:#fffaf6; --card:#ffffff; --ink:#4a3a33; --muted:#8f7d72; --accent:#c98d6c; --line:rgba(193,140,110,.35); --ok:#5f8a5a; --wa:#2f8f5b;
  --f-script:"Pinyon Script","Snell Roundhand",cursive; --f-serif:"Cormorant Garamond",Georgia,serif; --f-ui:"Montserrat","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--f-ui)}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:40px 80px;display:flex;flex-direction:column;gap:22px}
h1{font:400 clamp(44px,9vw,64px)/1 var(--f-script);color:var(--accent);margin:0;text-align:center}
.sub{text-align:center;font:italic 400 19px var(--f-serif);color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px}
label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
textarea,input{width:100%;font:400 15px/1.5 var(--f-ui);color:var(--ink);border:1px solid var(--line);background:#fff;padding:12px;border-radius:2px}
textarea{min-height:160px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,.btn{font:500 11px var(--f-ui);letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:12px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;border-radius:2px}
button.ghost{background:transparent;color:var(--ink)}
.btn.wa{background:var(--wa);border-color:var(--wa)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:0}
.count{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center}
.item .nm{font:400 22px/1.2 var(--f-serif)}
.item .url{grid-column:1/-1;font-size:12px;color:var(--muted);word-break:break-all;user-select:all}
.item .act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.item .act button,.item .act .btn{padding:10px 12px;font-size:10px}
.done{color:var(--ok)!important;border-color:var(--ok)!important}
.empty{text-align:center;color:var(--muted);font:italic 400 18px var(--f-serif);padding:24px;border:1px dashed var(--line)}
@media (max-width:560px){.item{grid-template-columns:1fr}.item .act{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Guest Links</h1>
  <p class="sub">Paste your guest list, one name per line, and get a personal invitation link for each guest.</p>

  <section class="card">
    <label for="names">Guest names</label>
    <textarea id="names" placeholder="Mr. &amp; Mrs. Perera&#10;Nimal &amp; Family&#10;Sachini"></textarea>
    <label for="base">Invitation website</label>
    <input id="base" value="https://mihiniii.github.io/randula-thilina/">
    <label for="msg">WhatsApp message</label>
    <textarea id="msg" style="min-height:96px">Dear {name},

With joyful hearts, we warmly invite you to celebrate our wedding 💍

📅 Wednesday, 27 January 2027
🕘 Poruwa Ceremony at 9.41 am
📍 Eagle Hall, Waters Edge, Battaramulla

Please open your invitation here 👇
{link}

Kindly let us know if you can join us by 10 January 2027 using the RSVP in the invitation.

With love,
Randula & Thilina 🤍</p>
    <div class="row">
      <button type="button" id="make">Create links</button>
      <button type="button" class="ghost" id="copyAll">Copy all links</button>
      <span class="count" id="count"></span>
    </div>
  </section>

  <div class="list" id="list"><p class="empty">Your guest links will appear here.</p></div>
</div>

<script>
const $=id=>document.getElementById(id);
const el=(t,p={},k=[])=>{const n=Object.assign(document.createElement(t),p);n.append(...k);return n;};
let rows=[];
function slug(name){ return name.replace(/&/g," and ").replace(/[^\p{L}\p{N}.']+/gu,"-").replace(/^-+|-+$/g,""); }
function linkFor(name){ let b=($("base").value.trim()||"https://mihiniii.github.io/randula-thilina/").replace(/[?#].*$/,""); if(!b.endsWith("/")) b+="/"; return b+"#"+encodeURI(slug(name)); }
function msgFor(name,link){ return $("msg").value.replaceAll("{name}",name).replaceAll("{link}",link); }
async function copy(text,btn){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta=el("textarea",{value:text}); document.body.append(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove(); }
  if(btn){ const o=btn.textContent; btn.textContent="Copied"; btn.classList.add("done"); setTimeout(()=>{btn.textContent=o;btn.classList.remove("done");},1400); }
}
function render(){
  const names=$("names").value.split(/\n+/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean);
  rows=names.map(n=>({name:n,link:linkFor(n)}));
  const L=$("list"); L.replaceChildren();
  if(!rows.length){ L.append(el("p",{className:"empty",textContent:"Add at least one name above."})); $("count").textContent=""; return; }
  rows.forEach(r=>{
    const cp=el("button",{type:"button",className:"ghost",textContent:"Copy link"}); cp.onclick=()=>copy(r.link,cp);
    const cm=el("button",{type:"button",className:"ghost",textContent:"Copy message"}); cm.onclick=()=>copy(msgFor(r.name,r.link),cm);
    const wa=el("a",{className:"btn wa",href:"https://wa.me/?text="+encodeURIComponent(msgFor(r.name,r.link)),target:"_blank",rel:"noopener",textContent:"WhatsApp"});
    const op=el("a",{className:"btn",href:r.link,target:"_blank",rel:"noopener",textContent:"Preview"});
    L.append(el("div",{className:"item"},[el("div",{className:"nm",textContent:r.name}), el("div",{className:"act"},[op,cp,cm,wa]), el("div",{className:"url",textContent:r.link})]));
  });
  $("count").textContent=rows.length+" link"+(rows.length>1?"s":"")+" ready";
  try{ localStorage.setItem("rt-guests",$("names").value); }catch(e){}
}
$("make").onclick=render;
$("copyAll").onclick=e=>{ if(!rows.length) render(); copy(rows.map(r=>r.name+"\t"+r.link).join("\n"),e.currentTarget); };
try{ const saved=localStorage.getItem("rt-guests"); if(saved){ $("names").value=saved; render(); } }catch(e){}
</script>
</body>
</html>
